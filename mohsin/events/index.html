      #monthLabel {
        position: absolute;
        left: 675px;
        bottom: 649px;

    <script>
      const shortInput = document.getElementById("EventName");
      const button = document.getElementById("enterBtn");

      // When user presses Enter
      shortInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          button.click();
        } else {console.log("Not working")}
      });


      const selectDay = document.getElementById("dayS");
      const selectMonth = document.getElementById("monthS");
      const selectYear = document.getElementById("yearS");
      // Get the selected value
      let selectedDay = selectDay.value;
      let selectedMonth = selectMonth.value;
      let selectedYear = selectYear.value;

      console.log("Selected day:", selectedDay);
      console.log("Selected month:", selectMonth);
      console.log("Selected month:", selectYear);

      // Update variable when user changes selection
      selectDay.addEventListener("change", function() {
        selectedDay = this.value;
        console.log("Now day:", selectedDay);
      });
      selectMonth.addEventListener("change", function() {
        selectedMonth = this.value;
        console.log("Now month:", selectedMonth);
      });
      selectYear.addEventListener("change", function() {
        selectedYear = this.value;
        console.log("Now year:", selectedYear);
      });



      let user = JSON.parse(localStorage.getItem("userInputSave")) || {};
      let counter = Object.keys(user).length;

      const userList = document.getElementById("userList");

      function renderList() {
        userList.innerHTML = ""; // clear old list
        for (let key in user) {
          const li = document.createElement("li");
          li.textContent = user[key];

          // Create delete button
          const delBtn = document.createElement("button");
          delBtn.textContent = "Remove";
          delBtn.style.marginLeft = "15px";
          delBtn.style.marginTop = "10px";
          delBtn.style.fontFamily = "'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif"
          delBtn.style.fontSize = "large";
          delBtn.style.position = "relative";
          delBtn.style.color = "darkred";
          delBtn.style.backgroundColor = "rgb(255, 208, 208)";
          delBtn.style.border = "0px"
          delBtn.style.width = "82px"
          delBtn.style.height = "30px"
          delBtn.style.cursor = "pointer"

          delBtn.addEventListener("click", () => {
            delete user[key];
            localStorage.setItem("userInputSave", JSON.stringify(user));
            renderList(); // refresh list
          });

          li.appendChild(delBtn);
          userList.appendChild(li);
        }
      }

      //عند ضغط الزر يتم حفظ ما تم ادخاله
      //let (selectedDay), (selectedMonth), (selectedYear)
      document.getElementById("enterBtn").addEventListener("click", () => {
        const input_eventName = document.getElementById("EventName").value.trim();
        if (input_eventName.length === 0) {
          alert("Type Event Name");
          return;

        }
        const Date_Event = `${input_eventName} - ${selectedDay}/${selectedMonth}/${selectedYear}`
        if (Date_Event) {
          const random = Math.random();
          const newKey = `name: ${random}`; console.log(newKey)
          user[newKey] = Date_Event;

          localStorage.setItem("userInputSave", JSON.stringify(user));
          console.log(user);
          document.getElementById("EventName").value = "";
          document.getElementById("dayS").value = "1"; 
          document.getElementById("monthS").value = "1"; 
          document.getElementById("yearS").value = "2026"; 
          renderList();
        }
      });
      //نظام حذف المدخلات عن طريق الازرار
      renderList();
    </script>
