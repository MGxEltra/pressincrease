<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <title>مقاضي</title>
    <meta charset="UTF-8">
  </head>
  <body>
    <button onclick="Enter()" class="Input">ادخل</button>
    <input placeholder="ادخل ما تريد.." class="Inp" style="
    position: absolute;
    width: 500px;
    height: 50px;
    background-color: blanchedalmond;
    border: 0;
    transform: translateX(-45%) translateY(650%);
    font-size: xx-large;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    
    ">
    <style>
      .Input:active {
        background-color: rgb(208, 58, 58);
      }

      .Input {
        position: absolute;
        width: 300px;
        height: 100px;
        font-size: xxx-large;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        transform: translateX(-110%) translateY(500%);
        border: 0;
        background-color: lightcoral;
        font-weight: bolder;
        color:gold;
      }
    </style>

    <h1 class="Dance" style="display: block;
    position: absolute;
    transform: translateX(-300%) translateY(2000%);
    font-size: x-large;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    "></h1>

    <script>
      const user_input = document.querySelector(".Inp")

      function Enter() {
        document.querySelector(".Dance").innerHTML = user_input.value
      }
      
    </script>
  </body>
</html>
