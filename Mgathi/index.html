<!DOCTYPE html>
<html lang="ar" dir="auto">
  <head>
    <title>مقاضي العائلة</title>
    <meta charset="UTF-8">
    <style>
      body {background-image: linear-gradient(#fddddd, rgb(216, 203, 145),#fddddd,#fddddd,#fddddd,#fddddd)}
    </style>
  </head>
  <body>

    <h3 style="display: block;
    position: absolute;
    bottom: 0px;
    left: 570px;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    ">©2026 محسن الشمري. جميع الحقوق محفوظة<br>هذا الموقع يخزن مدخلاتك محليًّا في متصفح جهازك</h3>

    <input  placeholder="اكتب.." id="Input">
    <button id="enterBtn" class="Kosa" >احفظ</button>
    <div class="ListBox">
      <ul id="userList"></ul>
    </div>
    <style>
      #enterBtn {
        
        position: absolute;
        transform: translate(-360%, 250%);
        width: 200px;
        height: 50px;
        border: 0;
        cursor: pointer;
        background-color: rgb(221, 132, 132);
        border-radius: 100px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-size: x-large;
        transition-duration: 0.02s;
        transform-origin: 100%;
        transition-delay: 0.01s;
      }
      
      #enterBtn:disabled {
        
        position: absolute;
        transform: translate(-360%, 255%);
        width: 200px;
        height: 50px;
        border: 0;
        cursor: pointer;
        background-color: rgb(155, 150, 150);
        border-radius: 100px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-size: x-large;
        transition-duration: 0.01s;
        transform-origin: 100%;
        transition-delay: 0.01s;
        cursor: not-allowed;
      }
      
      #Input {
        position: absolute;
        transform: translate(-152.5%, 30%);
        width: 400px;
        height: 70px;
        font-size: xx-large;
        color: rgb(50, 9, 9);
        border: 0;
        border-radius: 10px;
        background-color: rgb(255, 255, 255);
        text-shadow: 10px;
        
      }

      .ListBox {
        position: absolute;
        font-size: xx-large;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        height: 500px;
        width: 700px;
        left: 415px;
        bottom: 70px;
        overflow-y: auto; 
        overflow-x: hidden; 
        word-wrap: break-word;
        background-color: rgb(255, 255, 239);
        border-radius: 10px;
        
      }
    </style>
      
    <script>
      //اذا المدخل فاضي عطل الزر
      button = document.getElementById("enterBtn");
      input = document.getElementById("Input")

      button.addEventListener("click", () => {
        button.disabled = true;
        button.innerHTML = "انتظر"
        const timeout = setTimeout(() => {button.disabled = false; button.innerHTML="احفظ"}, 3000);
        
      })  
      
      
      //في حال ضغط المستخدم على زر انتر يعتبره ضغط على الزر
      input.addEventListener("keyup", (event) => {
        if (event.key === "Enter") {
          button.click();
      }})
    </script>







    <script>
     
      //اخذ قيمة مدخل المستخدم مثلا برتقال
      let user = JSON.parse(localStorage.getItem("userInputSave")) || {};
      let counter = Object.keys(user).length;

      const userList = document.getElementById("userList");

      function renderList() {
        userList.innerHTML = ""; // clear old list
        for (let key in user) {
          const li = document.createElement("li");
          li.textContent = user[key];

          // Create delete button
          const delBtn = document.createElement("button");
          delBtn.textContent = "احذف";
          delBtn.style.marginRight = "15px";
          delBtn.style.marginTop = "10px";
          delBtn.style.fontFamily = "'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif"
          delBtn.style.fontSize = "large";
          delBtn.style.position = "relative";
          delBtn.style.color = "darkred";
          delBtn.style.backgroundColor = "rgb(255, 208, 208)";
          delBtn.style.border = "0px"
          delBtn.style.width = "80px"
          delBtn.style.height = "30px"
          delBtn.style.cursor = "pointer"

          delBtn.addEventListener("click", () => {
            delete user[key];
            localStorage.setItem("userInputSave", JSON.stringify(user));
            renderList(); // refresh list
          });

          li.appendChild(delBtn);
          userList.appendChild(li);
        }
      }

      //عند ضغط الزر يتم حفظ ما تم ادخاله
      document.getElementById("enterBtn").addEventListener("click", () => {
        const input = document.getElementById("Input").value.trim();
        if (input) {
          counter++;
          const newKey = `name${counter}`;
          user[newKey] = input;

          localStorage.setItem("userInputSave", JSON.stringify(user));
          console.log(user);
          document.getElementById("Input").value = ""; 
          renderList();
        }
      });
      //نظام حذف المدخلات عن طريق الازرار
      renderList();

    </script>
  </body>
</html>
